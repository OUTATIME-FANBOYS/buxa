# Local development database. `docker compose up -d db`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: buxa
      POSTGRES_PASSWORD: buxa
      POSTGRES_DB: buxa
    ports: ["5433:5432"]
    volumes: ["buxa-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buxa"]
      interval: 3s
      retries: 20
volumes:
  buxa-pg:
