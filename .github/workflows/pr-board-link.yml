name: PR board link
# Every pull request must link the board issue it tracks, with "Closes #n", "Fixes #n" or "Refs #n".
# A PR with no linked issue gets a warning, not a failure. The board's own automations
# add the PR to the project and move the issue as the PR opens and merges.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  link:
    name: Board issue linked
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR body links an issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -qiE '(closes|fixes|resolves|refs) +#[0-9]+'; then
            echo "Linked issue found."
          else
            echo "::warning::No board issue is linked in the PR body. Add 'Closes #123' (or 'Refs #123') so the board can follow this PR."
          fi
