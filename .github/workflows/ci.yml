name: CI
on:
  push: { branches: [main, develop] }
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: buxa, POSTGRES_PASSWORD: buxa, POSTGRES_DB: buxa }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U buxa" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgres://buxa:buxa@localhost:5433/buxa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
