name: 'Setup Node and restore dependencies'
description: 'Sets up Node.js 22 and restores cached node_modules'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22
    - uses: actions/cache/restore@v6
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
        fail-on-cache-miss: true
